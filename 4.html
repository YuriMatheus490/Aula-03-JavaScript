<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius</title>
</head>
<body>
    <!-- 02. Você está no Brasil, e para temperatura usamos o grau Celsius.
Porém, quando você for contrato para trabalhar como programador JavaScript 
no exterior, deverá usar graus Fahrenheit.
Celsius * 1,8 + 32 = Fahrenheit
Fahrenheit - 32 * 0,5556-->
<script>
    let celsius = parseFloat(prompt('Digite a temperatura em graus Celsius '));
        //processamento 
        let fah = (celsius * 1.8) + 32;
        
        //saída
        var resultado = "Conversão para Fahrenheit é : " + fah + "\n" 

        document.writeln(resultado);

        //Já tinha feita na aula, vou fazer em casa com tela
</script>
    
</body>
</html>
