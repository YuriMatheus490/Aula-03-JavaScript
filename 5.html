<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrenheit</title>
</head>
<body>
    <!-- 03. Agora faça o contrário. Você fornece a temperatura em graus Fahrenheit,
seu programa deve converter para Celsius e exibir na tela a temperatura em 
graus Celsius.
Celsius * 1,8 + 32 = Fahrenheit
Fahrenheit - 32 * 0,5556-->
<script>
    let fah = parseFloat(prompt('Digite a temperatura em graus Fahrenheit '));
        //processamento 
        let celsius = (fah - 32) * 0.5556;
        
        //saída
        var resultado = "Conversão para Fahrenheit é : " + celsius + "\n" 
        
        document.writeln(resultado);

        //Já tinha feita na aula, vou fazer em casa com tela
</script>
    
</body>
</html>
