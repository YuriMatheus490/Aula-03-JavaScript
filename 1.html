<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconto 7%</title>
</head>
<body>
    <!-- 5. Construa uma página onde o usuário digitará o valor de um produto e o programa descontará 7% do valor do produto.-->
     <script>
        //entrada
    let valor1 = parseFloat(prompt('Digite o valor do produto '));
        //processamento
        let desconto = (valor1 * 7 / 100)

        //saída
        var resultado = "O desconto será de : " + desconto

        document.writeln(resultado);
     </script>
    
</body>
</html>
